services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-tuning
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: Oracle123
    volumes:
      - ./sql:/opt/sql
      - oradata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
volumes:
  oradata:
